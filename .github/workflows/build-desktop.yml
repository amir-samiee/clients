  windows:
    name: Windows Build [${{ matrix.variant }}]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: oss
            license_type: oss
            artifact_prefix: ""
          - variant: bit
            license_type: commercial
            artifact_prefix: "commercial-"
    runs-on: windows-2022
    needs:
      - setup
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    env:
      _PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
      _NODE_VERSION: ${{ needs.setup.outputs.node_version }}
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
          node-version: ${{ env._NODE_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            apps/desktop/desktop_native -> target
          cache-targets: "true"

      - name: Install AST
        run: dotnet tool install --global AzureSignTool --version 4.0.1

      - name: Print environment
        run: |
          node --version
          npm --version
          choco --version
          rustup show

      - name: Install Node dependencies
        run: npm ci
        working-directory: ./

      - name: Download SDK Artifacts
        if: ${{ inputs.sdk_branch != '' && needs.setup.outputs.has_secrets == 'true' && matrix.license_type != 'commercial' }}
        uses: bitwarden/gh-actions/download-artifacts@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-wasm-internal.yml
          workflow_conclusion: success
          branch: ${{ inputs.sdk_branch }}
          artifacts: sdk-internal
          repo: bitwarden/sdk-internal
          path: ../sdk-internal
          if_no_artifact_found: fail

      - name: Override SDK
        if: ${{ inputs.sdk_branch != '' && needs.setup.outputs.has_secrets == 'true' && matrix.license_type != 'commercial' }}
        working-directory: ./
        run: |
          ls -l ../
          npm link ../sdk-internal

      - name: Download Commercial SDK Artifacts
        if: ${{ inputs.sdk_branch != '' && needs.setup.outputs.has_secrets == 'true' && matrix.license_type == 'commercial' }}
        uses: bitwarden/gh-actions/download-artifacts@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-wasm-internal.yml
          workflow_conclusion: success
          branch: ${{ inputs.sdk_branch }}
          artifacts: commercial-sdk-internal
          repo: bitwarden/sdk-internal
          path: ../commercial-sdk-internal
          if_no_artifact_found: fail

      - name: Override Commercial SDK
        if: ${{ inputs.sdk_branch != '' && needs.setup.outputs.has_secrets == 'true' && matrix.license_type == 'commercial' }}
        working-directory: ./
        run: |
          npm link ../commercial-sdk-internal

      - name: Cache Native Module
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            apps/desktop/desktop_native/napi/*.node
            apps/desktop/desktop_native/dist/*
          key: rust-${{ runner.os }}-${{ hashFiles('apps/desktop/desktop_native/**/*', 'package-lock.json') }}

      - name: Build Native Module
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop/desktop_native
        env:
          MODE: ${{ github.event_name == 'workflow_call' && '--release' || '' }}
        run: node build.js cross-platform "$env:MODE"

      - name: Build
        run: npm run build:${{ matrix.variant }}

      # Retrieve signing secrets only after dependencies are installed and the build has finished.
      - name: Log in to Azure
        if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Retrieve secrets
        id: retrieve-secrets
        if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: "bitwarden-ci"
          secrets: "code-signing-vault-url,
            code-signing-client-id,
            code-signing-tenant-id,
            code-signing-client-secret,
            code-signing-cert-name"

      - name: Log out from Azure
        if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Pack
        if: ${{ needs.setup.outputs.has_secrets == 'false' }}
        run: |
          npm run pack:win

      - name: Pack & Sign
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        env:
          ELECTRON_BUILDER_SIGN: 0
          SIGNING_VAULT_URL: ${{ steps.retrieve-secrets.outputs.code-signing-vault-url }}
          SIGNING_CLIENT_ID: ${{ steps.retrieve-secrets.outputs.code-signing-client-id }}
          SIGNING_TENANT_ID: ${{ steps.retrieve-secrets.outputs.code-signing-tenant-id }}
          SIGNING_CLIENT_SECRET: ${{ steps.retrieve-secrets.outputs.code-signing-client-secret }}
          SIGNING_CERT_NAME: ${{ steps.retrieve-secrets.outputs.code-signing-cert-name }}
        run: |
          npm run pack:win

      - name: Rename appx files for store
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        run: |
          Rename-Item -Path "./dist/Bitwarden-$env:_PACKAGE_VERSION-ia32.appx" `
            -NewName "Bitwarden-$env:_PACKAGE_VERSION-ia32-store.appx"
          Rename-Item -Path "./dist/Bitwarden-$env:_PACKAGE_VERSION-x64.appx" `
            -NewName "Bitwarden-$env:_PACKAGE_VERSION-x64-store.appx"
          Rename-Item -Path "./dist/Bitwarden-$env:_PACKAGE_VERSION-arm64.appx" `
            -NewName "Bitwarden-$env:_PACKAGE_VERSION-arm64-store.appx"

      # An Appx can only be signed when its manifest publisher matches the certificate
      # subject, so read the subject from the signed binary.
      - name: Read signing certificate subject
        id: cert-subject
        if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        run: |
          $signature = Get-AuthenticodeSignature "./dist/win-unpacked/Bitwarden.exe"
          if ($null -eq $signature.SignerCertificate) {
            Write-Error "Expected a signed exe, got status '$($signature.Status)': $($signature.StatusMessage)"
            exit 1
          }
          $subject = $signature.SignerCertificate.Subject
          Write-Host "Signing certificate subject: $subject"
          "publisher=$subject" >> $env:GITHUB_OUTPUT

      # Packs and signs the Appx with the CI signing certificate and publisher.
      # Reuses the compiled Rust and webpack builds from above, so we only need
      # to swap out the manifest, recompress and sign.
      - name: Pack & sign appx for direct download
        if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        env:
          ELECTRON_BUILDER_SIGN: 1
          ELECTRON_BUILDER_SIGN_APPX: 1
          SIGNING_VAULT_URL: ${{ steps.retrieve-secrets.outputs.code-signing-vault-url }}
          SIGNING_CLIENT_ID: ${{ steps.retrieve-secrets.outputs.code-signing-client-id }}
          SIGNING_TENANT_ID: ${{ steps.retrieve-secrets.outputs.code-signing-tenant-id }}
          SIGNING_CLIENT_SECRET: ${{ steps.retrieve-secrets.outputs.code-signing-client-secret }}
          SIGNING_CERT_NAME: ${{ steps.retrieve-secrets.outputs.code-signing-cert-name }}
          _APPX_PUBLISHER: ${{ steps.cert-subject.outputs.publisher }}
        run: node ./scripts/pack-signed-appx.mts --config electron-builder.json --publisher $env:_APPX_PUBLISHER

      # A signed Store package is rejected at ingestion and an unsigned direct download
      # installs for nobody, so confirm each package ended up as intended before we
      # upload any of them.
      - name: Verify appx signing state and publishers
        if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        env:
          _APPX_PUBLISHER: ${{ steps.cert-subject.outputs.publisher }}
        run: ./scripts/validate-appx-signatures.ps1 -Config electron-builder.json -SignedPublisher $env:_APPX_PUBLISHER

      - name: Fix NSIS artifact names for auto-updater
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        run: |
          Rename-Item -Path .\dist\Bitwarden-$env:_PACKAGE_VERSION-ia32.nsis.7z `
            -NewName bitwarden-$env:_PACKAGE_VERSION-ia32.nsis.7z
          Rename-Item -Path .\dist\Bitwarden-$env:_PACKAGE_VERSION-x64.nsis.7z `
            -NewName bitwarden-$env:_PACKAGE_VERSION-x64.nsis.7z
          Rename-Item -Path .\dist\Bitwarden-$env:_PACKAGE_VERSION-arm64.nsis.7z `
            -NewName bitwarden-$env:_PACKAGE_VERSION-arm64.nsis.7z

      # - name: Upload portable exe artifact
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: ${{ matrix.artifact_prefix }}Bitwarden-Portable-${{ env._PACKAGE_VERSION }}.exe
      #     path: apps/desktop/dist/Bitwarden-Portable-${{ env._PACKAGE_VERSION }}.exe
      #     if-no-files-found: error

      - name: Upload installer exe artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}Bitwarden-Installer-${{ env._PACKAGE_VERSION }}.exe
          path: apps/desktop/dist/nsis-web/Bitwarden-Installer-${{ env._PACKAGE_VERSION }}.exe
          if-no-files-found: error

      - name: Upload appx ia32 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}Bitwarden-${{ env._PACKAGE_VERSION }}-ia32.appx
          path: apps/desktop/dist/Bitwarden-${{ env._PACKAGE_VERSION }}-ia32.appx
          if-no-files-found: error

      - name: Upload store appx ia32 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}Bitwarden-${{ env._PACKAGE_VERSION }}-ia32-store.appx
          path: apps/desktop/dist/Bitwarden-${{ env._PACKAGE_VERSION }}-ia32-store.appx
          if-no-files-found: error

      - name: Upload NSIS ia32 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}bitwarden-${{ env._PACKAGE_VERSION }}-ia32.nsis.7z
          path: apps/desktop/dist/nsis-web/bitwarden-${{ env._PACKAGE_VERSION }}-ia32.nsis.7z
          if-no-files-found: error

      - name: Upload appx x64 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}Bitwarden-${{ env._PACKAGE_VERSION }}-x64.appx
          path: apps/desktop/dist/Bitwarden-${{ env._PACKAGE_VERSION }}-x64.appx
          if-no-files-found: error

      - name: Upload store appx x64 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}Bitwarden-${{ env._PACKAGE_VERSION }}-x64-store.appx
          path: apps/desktop/dist/Bitwarden-${{ env._PACKAGE_VERSION }}-x64-store.appx
          if-no-files-found: error

      - name: Upload NSIS x64 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}bitwarden-${{ env._PACKAGE_VERSION }}-x64.nsis.7z
          path: apps/desktop/dist/nsis-web/bitwarden-${{ env._PACKAGE_VERSION }}-x64.nsis.7z
          if-no-files-found: error

      - name: Upload appx ARM64 artifact
        if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}Bitwarden-${{ env._PACKAGE_VERSION }}-arm64.appx
          path: apps/desktop/dist/Bitwarden-${{ env._PACKAGE_VERSION }}-arm64.appx
          if-no-files-found: error

      - name: Upload store appx ARM64 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}Bitwarden-${{ env._PACKAGE_VERSION }}-arm64-store.appx
          path: apps/desktop/dist/Bitwarden-${{ env._PACKAGE_VERSION }}-arm64-store.appx
          if-no-files-found: error

      - name: Upload NSIS ARM64 artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}bitwarden-${{ env._PACKAGE_VERSION }}-arm64.nsis.7z
          path: apps/desktop/dist/nsis-web/bitwarden-${{ env._PACKAGE_VERSION }}-arm64.nsis.7z
          if-no-files-found: error

      - name: Upload nupkg artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}bitwarden.${{ env._PACKAGE_VERSION }}.nupkg
          path: apps/desktop/dist/chocolatey/bitwarden.${{ env._PACKAGE_VERSION }}.nupkg
          if-no-files-found: error

      - name: Upload auto-update artifact
        # if: ${{ needs.setup.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}${{ needs.setup.outputs.release_channel }}.yml
          path: apps/desktop/dist/nsis-web/${{ needs.setup.outputs.release_channel }}.yml
          if-no-files-found: error
