# This workflow will run in the context of the source of the PR.
# On a PR from a fork, the workflow will not have access to secrets, and so any parts of the build that require secrets will not run.
# If additional artifacts are needed for a fork PR, review it and add the "ci:signed-build" label to run "build-desktop-target.yml".

name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      sdk_branch:
        description: "Custom SDK branch"
        required: false
        type: string
      testflight_distribute:
        description: "Force distribute to TestFlight regardless of branch (useful for QA testing on feature branches)"
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  electron-verify:
    name: Verify Electron Version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Verify
        run: |
          PACKAGE_VERSION=$(jq -r .devDependencies.electron package.json)
          ELECTRON_BUILDER_VERSION=$(jq -r .electronVersion ./apps/desktop/electron-builder.json)

          if [[ "$PACKAGE_VERSION" == "$ELECTRON_BUILDER_VERSION"  ]]; then
            echo "Versions matches"
          else
            echo "Version mismatch, package.json: $PACKAGE_VERSION, electron-builder.json: $ELECTRON_BUILDER_VERSION"
            exit 1
          fi

  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ steps.retrieve-version.outputs.package_version }}
      beta_package_version: ${{ steps.retrieve-version.outputs.beta_package_version }}
      beta_number: ${{ steps.retrieve-version.outputs.beta_number }}
      ms_store_in_scope: ${{ steps.retrieve-version.outputs.ms_store_in_scope }}
      release_channel: ${{ steps.release-channel.outputs.channel }}
      build_number: ${{ steps.increment-version.outputs.build_number }}
      rc_branch_exists: ${{ steps.branch-check.outputs.rc_branch_exists }}
      hotfix_branch_exists: ${{ steps.branch-check.outputs.hotfix_branch_exists }}
      node_version: ${{ steps.retrieve-node-version.outputs.node_version }}
      has_secrets: ${{ steps.check-secrets.outputs.has_secrets }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Get Package Version
        id: retrieve-version
        run: |
          PKG_VERSION=$(jq -r .version src/package.json)
          echo "Setting version number to $PKG_VERSION"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          # beta-release.json holds the beta ordinal, which is bumped on rc for a
          # second beta off the same base version. electron-updater only serves a beta
          # that out-ranks the installed one.
          BETA_NUMBER=$(jq -r '.betaNumber' beta-release.json)
          if [[ ! "$BETA_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "[!] Invalid beta ordinal '$BETA_NUMBER'; expected a positive integer"
            exit 1
          fi

          BETA_PKG_VERSION="$PKG_VERSION-beta.$BETA_NUMBER"
          echo "Setting beta version number to $BETA_PKG_VERSION"
          echo "beta_number=$BETA_NUMBER" >> "$GITHUB_OUTPUT"
          echo "beta_package_version=$BETA_PKG_VERSION" >> "$GITHUB_OUTPUT"

          # Whether this beta cycle publishes the Windows Store appx. Checked by
          # windows-beta-store-check, which is where the reasoning lives.
          MS_STORE_IN_SCOPE=$(jq -r '.msStoreInScope' beta-release.json)
          if [[ "$MS_STORE_IN_SCOPE" != "true" && "$MS_STORE_IN_SCOPE" != "false" ]]; then
            echo "[!] Invalid msStoreInScope '$MS_STORE_IN_SCOPE'; expected true or false"
            exit 1
          fi
          echo "ms_store_in_scope=$MS_STORE_IN_SCOPE" >> "$GITHUB_OUTPUT"

      - name: Increment Version
        id: increment-version
        run: |
          BUILD_NUMBER=$((3000 + GITHUB_RUN_NUMBER))
          echo "Setting build number to $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Get Version Channel
        id: release-channel
        env:
          _PACKAGE_VERSION: ${{ steps.retrieve-version.outputs.package_version }}
        run: |
          case "$_PACKAGE_VERSION" in
            *"alpha"*)
              echo "channel=alpha" >> "$GITHUB_OUTPUT"
              echo "[!] We do not yet support 'alpha'"
              exit 1
              ;;
            *"beta"*)
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "channel=latest" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check if special branches exist
        id: branch-check
        run: |
          if [[ $(git ls-remote --heads origin rc) ]]; then
            echo "rc_branch_exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "rc_branch_exists=0" >> "$GITHUB_OUTPUT"
          fi

          if [[ $(git ls-remote --heads origin hotfix-rc-desktop) ]]; then
            echo "hotfix_branch_exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "hotfix_branch_exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Node Version
        id: retrieve-node-version
        working-directory: ./
        run: |
          NODE_NVMRC=$(cat .nvmrc)
          NODE_VERSION=${NODE_NVMRC/v/''}
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        id: check-secrets
        run: |
          has_secrets=${{ secrets.AZURE_CLIENT_ID != '' }}
          echo "has_secrets=$has_secrets" >> "$GITHUB_OUTPUT"

